<div class="login-container">
  <div class="login-card text-center">
    <div class="card-body">
      <!-- Logo -->
      <div class="d-flex flex-column justify-content-center align-items-center mb-4">
        <img style="height: 50px;" src="./assets/images/brand/datamplify_white.png" alt="DataAmplify">
      </div>

      <!-- Title & Info -->
      <h1 class="display-4 mb-3 fw-semibold">Under Maintenance</h1>
      <p class="mb-4 op-8">The page you're looking for is currently under maintenance. We’ll be back soon.</p>

      <!-- Countdown Timer -->
      <div class="row g-3 justify-content-center mb-4">
        <div class="col-6 col-sm-3">
          <div class="under-maintenance-time">
            <p class="mb-1 fs-12 op-7">DAYS</p>
            <h4 class="fw-semibold mb-0">{{days}}</h4>
          </div>
        </div>
        <div class="col-6 col-sm-3">
          <div class="under-maintenance-time">
            <p class="mb-1 fs-12 op-7">HOURS</p>
            <h4 class="fw-semibold mb-0">{{hours}}</h4>
          </div>
        </div>
        <div class="col-6 col-sm-3">
          <div class="under-maintenance-time">
            <p class="mb-1 fs-12 op-7">MINUTES</p>
            <h4 class="fw-semibold mb-0">{{minutes}}</h4>
          </div>
        </div>
        <div class="col-6 col-sm-3">
          <div class="under-maintenance-time">
            <p class="mb-1 fs-12 op-7">SECONDS</p>
            <h4 class="fw-semibold mb-0">{{seconds}}</h4>
          </div>
        </div>
      </div>

      <!-- Social Buttons -->
      <div class="d-flex justify-content-center gap-2">
        <button class="btn btn-icon btn-login rounded-pill"><i class="fa-brands fa-facebook-f"></i></button>
        <button class="btn btn-icon btn-login rounded-pill"><i class="fa-brands fa-google"></i></button>
        <button class="btn btn-icon btn-login rounded-pill"><i class="fa-brands fa-twitter"></i></button>
        <button class="btn btn-icon btn-login rounded-pill"><i class="fa-brands fa-linkedin"></i></button>
      </div>
    </div>
  </div>
</div>
