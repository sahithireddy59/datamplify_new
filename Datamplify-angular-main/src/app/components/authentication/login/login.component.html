<div class="login-container">
  <div class="login-card">
    <div class="card-body">
      <!-- <h1 class="logo-text">DataAmplify</h1> -->
       <div class="d-flex flex-column justify-content-center align-items-center">
        <img style="height: 50px;" src="./assets/images/brand/datamplify_white.png" alt="">
       </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-4">
        <div class="form-group mb-3">
          <input 
            type="text" 
            class="form-control" 
            placeholder="Email" 
            formControlName="email"
            required>
            @if(loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched) {
            <div class="error-message">Email is required.</div>
            }
            @if(loginForm.get('email')?.hasError('pattern')){
            <div class="text-danger">Please enter a valid email address</div>
            }
        </div>
        <div class="form-group input-group mb-3">
          <input 
            [type]="showPassword1 ? 'text' : 'password'" 
            class="form-control" 
            placeholder="Password"
            formControlName="password"
            required>
            <button class="btn btn-info" (click)="toggleVisibility1()" type="button" id="button-addon21"><i class="ri-eye-{{toggleClass1}} align-middle"></i></button> 
        </div>
        
        <div class="d-flex justify-content-end align-items-center mb-4">
          <!-- <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="rememberMe">
            <label class="form-check-label" for="rememberMe">
              Remember Me
            </label>
          </div> -->
          <a routerLink="/authentication/forgot-password" class="forgot-password-link">Forgot Password?</a>
        </div>
        
        <button type="submit" class="btn btn-login w-100" [disabled]="!loginForm.valid">Log In</button>
      </form>
      <div class="text-center mt-4 signup-prompt">
        <span>Don't have an account yet? </span>
        <a routerLink="/authentication/register" class="signup-link">Sign Up</a>
      </div>
    </div>
  </div>
</div>
