<div class="login-container">

  <div class="login-card">
    <div class="card-body">
      <!-- Logo -->
      <div class="d-flex flex-column justify-content-center align-items-center mb-3">
        <img style="height: 50px;" src="./assets/images/brand/datamplify_white.png" alt="DataAmplify">
      </div>

      <!-- Title & Info -->
      <div class="text-center mb-4">
        <h4 class="mb-1">Email Activation</h4>
        <p>Enter the OTP sent to your registered email.</p>
      </div>

      <!-- OTP Input -->
      <form (ngSubmit)="validateOtp()">
        <div class="form-group mb-4">
          <label class="mb-2 fw-500">OTP <span class="text-danger">*</span></label>
          <ng-otp-input [config]="config" (onInputChange)="onOtpChange($event)"></ng-otp-input>
        </div>

        <!-- Submit Button -->
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-login">Submit</button>
        </div>

        <!-- Resend OTP -->
        <div class="text-center mt-2">
            @if(displayTimer){
            <p class="mb-1">Didn't receive OTP? Resend in {{ display }}s</p>
            }
            @if(resendOtp){
            <a style="cursor: pointer;" (click)="resendOtpApi()" class="signup-link">Resend OTP</a>
            }
        </div>
      </form>
    </div>
  </div>
</div>
