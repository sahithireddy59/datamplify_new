<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <div>
            <h4 class="card-title mb-1">Edit Schedule</h4>
            <p class="text-muted mb-0">{{ job?.name || 'Sync Job' }}</p>
          </div>
          <button class="btn btn-link" type="button" (click)="cancel()">Back</button>
        </div>
        <div class="card-body">
          <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

          <div *ngIf="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>

          <div *ngIf="!loading">
            <div class="mb-3">
              <label class="form-label">Schedule Frequency</label>
              <select class="form-select" [(ngModel)]="syncFrequency">
                <option value="manual">Manual</option>
                <option value="15min">Every 15 minutes</option>
                <option value="hourly">Hourly</option>
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="custom">Custom Cron</option>
              </select>
            </div>

            <div class="mb-3" *ngIf="syncFrequency === 'custom'">
              <label class="form-label">Cron Expression</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="cronExpression"
                placeholder="0 * * * *">
            </div>

            <div class="alert alert-secondary">
              <strong>Current mode:</strong> {{ job?.sync_mode || 'unknown' }}<br>
              <strong>Next sync:</strong> {{ job?.next_sync_at ? (job?.next_sync_at | date:'medium') : 'Not scheduled yet' }}
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button class="btn btn-outline-secondary" type="button" (click)="cancel()">Cancel</button>
              <button class="btn btn-primary" type="button" (click)="saveSchedule()" [disabled]="saving">
                {{ saving ? 'Saving...' : 'Save Schedule' }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
